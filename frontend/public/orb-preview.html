<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orb Assets Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #09111f;
        --bg-2: #172b47;
        --panel: rgba(11, 20, 36, 0.78);
        --border: rgba(178, 206, 255, 0.16);
        --text: #edf4ff;
        --muted: #99accd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(255, 186, 120, 0.12), transparent 25%),
          radial-gradient(circle at top right, rgba(163, 184, 255, 0.14), transparent 22%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
      }

      .shell {
        width: min(94vw, 1260px);
        min-height: min(90vh, 840px);
        border-radius: 30px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
        border: 1px solid var(--border);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px);
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        padding: 22px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 10px 0 6px;
        font-size: clamp(32px, 4vw, 48px);
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
      }

      .card {
        min-height: 660px;
        border-right: 1px solid var(--border);
        position: relative;
      }

      .card:last-child {
        border-right: none;
      }

      .label {
        position: absolute;
        top: 22px;
        left: 22px;
        z-index: 1;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 14px;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        --poster-color: transparent;
        background:
          radial-gradient(circle at center, rgba(255, 255, 255, 0.05), transparent 36%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
      }

      .sun-mini {
        width: 150px !important;
        height: 150px !important;
        margin: 120px auto 0;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: 460px;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        .card:last-child {
          border-bottom: none;
        }

        .sun-mini {
          margin-top: 70px;
        }
      }
    </style>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <section class="shell">
      <header class="topbar">
        <div class="eyebrow">3D Decorative Assets</div>
        <h1>Rotating Sun And Star Orbs</h1>
        <p>Simple stylized spherical assets prepared for hero scenes, ambient headers and decorative motion.</p>
      </header>

      <section class="grid">
        <article class="card">
          <div class="label">Radiant Sun Orb</div>
          <model-viewer
            class="sun-mini"
            src="./models/orb_sun_radiant.glb"
            alt="Rotating sun orb"
            camera-controls
            auto-rotate
            rotation-per-second="18deg"
            scale="0.86 0.86 0.86"
            camera-orbit="34deg 72deg 1.95m"
            min-camera-orbit="auto 35deg auto"
            max-camera-orbit="auto 105deg auto"
            field-of-view="36deg"
            shadow-intensity="1.45"
            exposure="1.26"
            environment-image="neutral"
          ></model-viewer>
        </article>

        <article class="card">
          <div class="label">Star Orb</div>
          <model-viewer
            src="./models/orb_star_simple.glb"
            alt="Rotating star orb"
            camera-controls
            auto-rotate
            rotation-per-second="16deg"
            camera-orbit="-35deg 75deg 3m"
            min-camera-orbit="auto 35deg auto"
            max-camera-orbit="auto 105deg auto"
            shadow-intensity="1"
            exposure="1.12"
            environment-image="neutral"
          ></model-viewer>
        </article>
      </section>
    </section>
  </body>
</html>
